<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SSD" />
    <title>SSD Dashboard</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/app-icon.svg" />
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/global.css">
    <meta name="view-transition" content="same-origin">
</head>
<body>
    <ssd-nav class="top"></ssd-nav>
    <main>
        <h1>SSD Dashboard</h1>
        <nav>
            <button onclick="loadSubpage('login/')">Login</button>
            <button onclick="loadSubpage('signup/')">Signup (Admin)</button>
            <button onclick="loadSubpage('whoami/')">Who Am I</button>

            <button onclick="loadSubpage('mission-start/')">Mission Start</button>
            <button onclick="loadSubpage('missions/')">Active Missions</button>
            <button onclick="logout()">Logout</button>
        </nav>

        <x-translation>welcome_message</x-translation>
        <ssd-icon name="user">user</ssd-icon>

        <ssd-intra-mission-list page_size="5"></ssd-intra-mission-list>
        <time-display show-countdown="true" show-date="nottoday">2026-04-01T18:10:00</time-display>

    </main>
    <ssd-nav class="bottom"></ssd-nav>
    <!-- <ssd-schedule></ssd-schedule> -->
    <script type="module" src="./assets/js/main.js"></script>
    <script type="module" src="/assets/js/api/api.generated.js"></script>
    <script type="module" src="/assets/js/util.js"></script>

    <script type="module" src="/assets/js/customElements/general/icon.js"></script>
    <script type="module" src="/assets/js/customElements/general/SimplePagination.js"></script>
    <script type="module" src="/assets/js/customElements/general/translation.js"></script>
    <script type="module" src="/assets/js/customElements/general/time-display.js"></script>
    <script type="module" src="/assets/js/customElements/ssd-alert/ssd-error.js"></script>
    <script type="module" src="/assets/js/customElements/ssd-alert/ssd-warning.js"></script>
    <script type="module" src="/assets/js/customElements/ssd-alert/ssd-ok.js"></script>

    <script type="module" src="/assets/js/customElements/ssd-nav.js"></script>


    <script type="module" src="/assets/js/customElements/api-elements/mission/missiondisplay.js"></script>
    <script type="module" src="/assets/js/customElements/api-elements/mission/missionlist.js"></script>
    <script type="module" src="/assets/js/customElements/api-elements/schedule/schedule.js"></script>
    <script type="module" src="/assets/js/customElements/api-elements/schedule/slot.js"></script>
    <script type="module" src="/assets/js/customElements/api-elements/ssd-user.js"></script>
    <script type="module" src="/assets/js/customElements/api-elements/forms/ssd-login.js"></script>

</body>
</html>
