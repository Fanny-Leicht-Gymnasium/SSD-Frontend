name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      docker_repository: ${{ steps.vars.outputs.docker_repository }}
      branch: ${{ steps.vars.outputs.branch }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image + branch
        id: vars
        run: |
          OWNER_REPO="${GITHUB_REPOSITORY,,}"
          OWNER="${OWNER_REPO%%/*}"
          REPO="${OWNER_REPO##*/}"
          REPO="${REPO//_/-}"
          IMAGE="ghcr.io/${OWNER}/${REPO}"

          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
          else
            BRANCH="release"
          fi

          BRANCH="${BRANCH,,}"
          BRANCH="${BRANCH//\//-}"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          echo "image=${IMAGE}:${BRANCH}" >> $GITHUB_OUTPUT
          echo "docker_repository=${IMAGE}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Build image (no push)
        run: |
          docker build -t ${{ steps.vars.outputs.image }} .

      - name: Save docker image
        run: |
          docker save ${{ steps.vars.outputs.image }} -o image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load docker image
        run: |
          docker load -i image.tar

      - name: Prepare docker-compose
        run: |
          echo "IMAGE_REF=${{ needs.build.outputs.image }}" >> .env

      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d

      - name: Start live logs + wait for healthcheck
        run: |
          # Start container logs in background
          docker logs -f app_test &
          LOG_PID=$!

          # Healthcheck loop
          for i in {1..30}; do
            if curl -fs http://localhost:8080/system/health > /dev/null; then
              kill $LOG_PID || true
              exit 0
            fi
            sleep 1
          done

          echo "Healthcheck failed"

          kill $LOG_PID || true
          exit 1

      - name: Shutdown test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down

  promote-stable:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/heads/')
    permissions:
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load docker image
        run: |
          docker load -i image.tar

      - name: Login GHCR
        uses: docker/login-action@v2 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push branch + stable
        run: |
          IMAGE=${{ needs.build.outputs.docker_repository }}
          BRANCH=${{ needs.build.outputs.branch }}

          docker tag ${IMAGE}:${BRANCH} ${IMAGE}:${BRANCH}
          docker tag ${IMAGE}:${BRANCH} ${IMAGE}:${BRANCH}-stable

          docker push ${IMAGE}:${BRANCH}
          docker push ${IMAGE}:${BRANCH}-stable

  full-release:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set version env
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION#v}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load docker image
        run: |
          docker load -i image.tar

      - name: Login GHCR
        uses: docker/login-action@v2 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push release
        run: |
          IMAGE=${{ needs.build.outputs.docker_repository }}
          BRANCH=${{ needs.build.outputs.branch }}

          docker tag ${IMAGE}:${BRANCH} ${IMAGE}:${VERSION}
          docker tag ${IMAGE}:${BRANCH} ${IMAGE}:v${MAJOR}
          docker tag ${IMAGE}:${BRANCH} ${IMAGE}:v${MAJOR}.${MINOR}
          docker tag ${IMAGE}:${BRANCH} ${IMAGE}:latest

          docker push ${IMAGE}:${VERSION}
          docker push ${IMAGE}:v${MAJOR}
          docker push ${IMAGE}:v${MAJOR}.${MINOR}
          docker push ${IMAGE}:latest
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes